name: Publish development site
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/DEVELOPMENT_GOALS.md'
      - 'tools/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate bilingual pages
        run: python3 tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
